name: Green CHAIN Weekly Forecast

on:
  schedule:
    - cron: "30 8 * * 3"
      timezone: "Asia/Manila"
  workflow_dispatch:
    inputs:
      source_pdf_url:
        description: "Optional official DA weekly PDF URL for a manual recovery run"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/weekly_forecast.yml"
      - "config/**"
      - "keys/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: greenchain-weekly-forecast
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.update.outputs.status }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
      - name: Check DA and prepare forecast
        id: update
        env:
          SOURCE_PDF_URL: ${{ inputs.source_pdf_url }}
        run: |
          if [[ -n "${SOURCE_PDF_URL}" ]]; then
            python scripts/update_weekly.py --pdf-url "${SOURCE_PDF_URL}"
          else
            python scripts/update_weekly.py
          fi
          status="$(python -c 'import json; print(json.load(open("state/update_result.json"))["status"])')"
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
      - name: Sign changed forecast
        env:
          FORECAST_SIGNING_KEY_B64: ${{ secrets.FORECAST_SIGNING_KEY_B64 }}
        run: |
          if [[ ! -f state/signing_required ]]; then
            echo "Forecast payload is unchanged; retaining its existing signature."
            exit 0
          fi
          if [[ -z "${FORECAST_SIGNING_KEY_B64}" ]]; then
            echo "FORECAST_SIGNING_KEY_B64 is not configured." >&2
            exit 1
          fi
          key_file="${RUNNER_TEMP}/forecast_private.pem"
          trap 'rm -f "${key_file}"' EXIT
          printf '%s' "${FORECAST_SIGNING_KEY_B64}" | base64 --decode > "${key_file}"
          chmod 600 "${key_file}"
          python scripts/sign_feed.py --private-key "${key_file}"
      - name: Verify published feed
        run: python scripts/verify_feed.py
      - name: Save verified observations and outputs
        run: |
          git config user.name "greenchain-forecast-bot"
          git config user.email "greenchain-forecast-bot@users.noreply.github.com"
          git add data reports public state/update_result.json
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "chore(forecast): weekly verified update"
            git push origin HEAD:main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy forecast feed
        id: deployment
        uses: actions/deploy-pages@v4

  model_health_alert:
    needs:
      - update
      - deploy
    if: ${{ always() && needs.update.result == 'success' && needs.deploy.result == 'success' && needs.update.outputs.status == 'DRIFT_BLOCKED' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require model review
        run: |
          echo "The new official observations were saved, but forecast publication was frozen because a production accuracy gate failed." >&2
          exit 1
